<!--
  Shown when a camera is clicked.
  Values available here: title, lat, lng, facing, note, back_label, rows
-->
<h2>{{title}}</h2>
<div class="note">{{lat}}, {{lng}} · {{facing}}</div>
<p class="note">{{note}}</p>

<p><button class="btn" id="back">{{back_label}}</button></p>

<h3>Mapped details (from OpenStreetMap tags)</h3>
<table>{{{rows}}}</table>

{{> data-use}}
